<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль учёта посещаемости — ИСП-О-25</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Окно авторизации -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-1 text-white">Журнал посещаемости</h2>
            <p class="text-slate-400 text-sm mb-6">Авторизуйтесь для доступа к системе</p>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Логин</label>
                    <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Пароль</label>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm">Войти в систему</button>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="main-app" class="hidden max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Шапка -->
        <header class="flex justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-xl">
            <div>
                <h1 class="text-lg font-bold text-white">Учёт посещаемости | Группа ИСП-О-25</h1>
                <p id="user-badge" class="text-xs text-indigo-400 font-medium"></p>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 transition">Выйти</button>
        </header>

        <!-- Фильтры и аналитика -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 mb-1">Выберите дату</label>
                <input type="date" id="selected-date" onchange="loadSchedule()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm">
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 mb-1">Поиск студента</label>
                <input type="text" id="search-input" oninput="filterStudents()" placeholder="Фамилия..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm">
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <span class="block text-xs text-slate-400">Посещаемость за день</span>
                    <span id="daily-stat" class="text-xl font-bold text-emerald-400">--%</span>
                </div>
                <div class="text-right">
                    <span class="block text-xs text-slate-400">Пропусков</span>
                    <span id="daily-absent" class="text-xl font-bold text-rose-400">0</span>
                </div>
            </div>
        </div>

        <!-- Сетка Расписания (Пары) -->
        <div id="schedule-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Динамически заполняются пары -->
        </div>
    </div>

    <!-- Модалка отметки пары -->
    <div id="pair-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <div>
                    <h3 id="modal-pair-title" class="font-bold text-lg text-white">Пара №</h3>
                    <p id="modal-pair-sub" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="closePairModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>

            <div class="my-4 space-y-2 overflow-y-auto flex-1 pr-2" id="students-list">
                <!-- Список студентов для отметки -->
            </div>

            <div class="pt-4 border-t border-slate-700 flex justify-end gap-3">
                <button onclick="closePairModal()" class="px-4 py-2 text-xs font-medium text-slate-300 hover:bg-slate-700 rounded-lg transition">Отмена</button>
                <button id="save-btn" onclick="saveAttendance()" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition">Сохранить посещаемость</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activePair = null;

        // Данные по умолчанию (Логины/Пароли убраны с экрана!)
        const scheduleData = [
            { pair: 1, time: "08:30 - 10:00", subject: "Разработка модулей ПО" },
            { pair: 2, time: "10:10 - 11:40", subject: "Математическое моделирование" },
            { pair: 3, time: "12:10 - 13:40", subject: "Иностранный язык в проф. сфере" },
            { pair: 4, time: "13:50 - 15:20", subject: "Физическая культура" }
        ];

        const mockStudents = [
            { id: 1, name: "Алексеев Дмитрий", subgroup: 1 },
            { id: 2, name: "Борисов Артём", subgroup: 1 },
            { id: 3, name: "Васильева Елена", subgroup: 2 },
            { id: 4, name: "Григорьев Максим", subgroup: 2 }
        ];

        document.getElementById('selected-date').valueAsDate = new Date();

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-badge').innerText = `${currentUser.name} (${getRoleName(currentUser.role)})`;
                loadSchedule();
            } else {
                alert(data.error);
            }
        }

        function getRoleName(role) {
            if (role === 'starosta') return 'Староста';
            if (role === 'zam_starosty') return 'Зам. старосты';
            return 'Куратор (Просмотр)';
        }

        function logout() {
            location.reload();
        }

        function loadSchedule() {
            const grid = document.getElementById('schedule-grid');
            grid.innerHTML = '';

            scheduleData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 hover:border-indigo-500 rounded-xl p-4 cursor-pointer transition flex flex-col justify-between";
                card.onclick = () => openPairModal(item);
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-indigo-400">Пара №${item.pair}</span>
                            <span class="text-xs text-slate-500">${item.time}</span>
                        </div>
                        <h4 class="font-medium text-white text-sm mb-4">${item.subject}</h4>
                    </div>
                    <div class="text-xs text-slate-400 border-t border-slate-700/50 pt-2 flex justify-between">
                        <span>Нажмите для отметки</span>
                        <span>&rarr;</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openPairModal(item) {
            activePair = item;
            document.getElementById('modal-pair-title').innerText = `Пара №${item.pair}: ${item.subject}`;
            document.getElementById('modal-pair-sub').innerText = `Время: ${item.time}`;

            const list = document.getElementById('students-list');
            list.innerHTML = '';

            mockStudents.forEach(st => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-900/60 p-3 rounded-lg border border-slate-700/50";
                row.innerHTML = `
                    <div>
                        <span class="text-sm font-medium text-slate-200">${st.name}</span>
                        <span class="text-xs text-slate-500 block">${st.subgroup}-я подгруппа</span>
                    </div>
                    <select data-student="${st.name}" data-subgroup="${st.subgroup}" class="status-select bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
                        <option value="present">Был(а)</option>
                        <option value="absent_valid">Н (Уважительная)</option>
                        <option value="absent_invalid">Н (Неув.)</option>
                    </select>
                `;
                list.appendChild(row);
            });

            // Ограничение прав куратора
            if (currentUser.role === 'kurator') {
                document.getElementById('save-btn').classList.add('hidden');
                document.querySelectorAll('.status-select').forEach(el => el.disabled = true);
            } else {
                document.getElementById('save-btn').classList.remove('hidden');
            }

            document.getElementById('pair-modal').classList.remove('hidden');
        }

        function closePairModal() {
            document.getElementById('pair-modal').classList.add('hidden');
        }

        async function saveAttendance() {
            const date = document.getElementById('selected-date').value;
            const selects = document.querySelectorAll('.status-select');
            const records = [];

            selects.forEach(s => {
                records.push({
                    student_name: s.dataset.student,
                    subgroup: parseInt(s.dataset.subgroup),
                    status: s.value
                });
            });

            const res = await fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date,
                    pair_number: activePair.pair,
                    subject: activePair.subject,
                    records,
                    userRole: currentUser.role,
                    username: currentUser.username
                })
            });

            if (res.ok) {
                alert('Посещаемость успешно сохранена!');
                closePairModal();
            } else {
                alert('Ошибка при сохранении.');
            }
        }

        function filterStudents() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const rows = document.querySelectorAll('#students-list > div');
            rows.forEach(r => {
                const name = r.querySelector('span').innerText.toLowerCase();
                r.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
