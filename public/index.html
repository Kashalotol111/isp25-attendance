<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учёт посещаемости — ИСП-О-25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">

    <!-- Авторизация -->
    <div id="login-view" class="flex items-center justify-center min-h-screen px-4">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 pointer-events-none"></div>
        <div class="relative bg-slate-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800">
            <div class="mb-6 text-center">
                <div class="w-12 h-12 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl mx-auto flex items-center justify-center mb-3 text-indigo-400 font-bold text-xl">25</div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Группа ИСП-О-25</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1">Система учёта посещаемости</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Логин</label>
                    <input type="text" id="login" required class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Пароль</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 text-sm text-white">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 transition rounded-2xl font-semibold text-white shadow-xl shadow-indigo-600/20 text-sm">
                    Войти в систему
                </button>
            </form>
        </div>
    </div>

    <!-- Главный интерфейс -->
    <div id="app-view" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3.5 sticky top-0 z-40 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-sm">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 sm:w-9 sm:h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white text-xs sm:text-sm">25</div>
                    <div>
                        <h1 class="text-sm sm:text-base font-bold text-white">ИСП-О-25</h1>
                        <p id="user-info" class="text-[11px] sm:text-xs text-slate-400 font-medium truncate max-w-[200px] sm:max-w-none"></p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button id="nav-btn-1" onclick="switchTab('schedule')" class="flex-1 sm:flex-none px-3.5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold transition">Расписание</button>
                <button id="nav-btn-2" onclick="switchTab('stats')" class="flex-1 sm:flex-none px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition">Статистика</button>
                <button onclick="logout()" class="px-3.5 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl text-xs font-semibold transition border border-rose-500/20">Выйти</button>
            </div>
        </header>

        <main class="flex-1 p-3 sm:p-6 max-w-5xl mx-auto w-full space-y-4 sm:space-y-6">
            <div id="view-schedule" class="space-y-4 sm:space-y-6">
                <!-- Панель управления: Дата и Удобный выбор недели -->
                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl sm:rounded-3xl p-4 sm:p-5 flex flex-col sm:flex-row gap-4 items-center justify-between shadow-lg">
                    <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-start">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Дата:</span>
                        <input type="date" id="attendance-date" class="bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl text-white text-xs sm:text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    
                    <!-- Удобные кнопки выбора недели вместо выпадающего списка -->
                    <div class="flex items-center gap-1.5 w-full sm:w-auto justify-between sm:justify-start bg-slate-950 p-1.5 border border-slate-800 rounded-2xl">
                        <button onclick="setWeekFilter('odd')" id="btn-week-odd" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-xs font-semibold transition bg-indigo-600 text-white shadow-sm">Нечетная</button>
                        <button onclick="setWeekFilter('even')" id="btn-week-even" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white">Четная</button>
                        <button onclick="setWeekFilter('all')" id="btn-week-all" class="flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white">Все</button>
                    </div>
                </div>
                <div id="schedule-container" class="space-y-4 sm:space-y-6"></div>
            </div>

            <div id="view-stats" class="hidden space-y-4">
                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-4">
                    <h2 id="stats-title" class="text-sm sm:text-base font-bold text-white">Статистика</h2>
                    <div id="stats-container" class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Модалки -->
    <div id="student-detail-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl max-w-2xl w-full p-4 sm:p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2.5 border-b border-slate-800">
                <h3 id="student-modal-title" class="text-sm sm:text-base font-bold text-white truncate pr-2">История пропусков</h3>
                <button onclick="closeModal('student-detail-modal')" class="text-slate-400 hover:text-white text-xl px-1">&times;</button>
            </div>
            <div id="student-absences-container" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs sm:text-sm"></div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                <button onclick="closeModal('student-detail-modal')" class="w-full sm:w-auto px-5 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="attendance-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl max-w-2xl w-full p-4 sm:p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2.5 border-b border-slate-800">
                <h3 id="modal-title" class="text-sm sm:text-base font-bold text-white truncate pr-2">Посещаемость</h3>
                <button onclick="closeModal('attendance-modal')" class="text-slate-400 hover:text-white text-xl px-1">&times;</button>
            </div>
            <div id="students-container" class="flex-1 overflow-y-auto space-y-2 pr-1 divide-y divide-slate-800/50"></div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex flex-col sm:flex-row justify-end gap-2.5">
                <button onclick="closeModal('attendance-modal')" class="w-full sm:w-auto px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold">Отмена</button>
                <button onclick="saveAttendance()" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="homework-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl max-w-md w-full p-4 sm:p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center pb-2.5 border-b border-slate-800">
                <h3 class="text-sm sm:text-base font-bold text-white">Редактирование ДЗ</h3>
                <button onclick="closeModal('homework-modal')" class="text-slate-400 hover:text-white text-xl px-1">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Домашнее задание на эту дату</label>
                    <textarea id="hw-text-input" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Ссылка на файл</label>
                    <input type="text" id="hw-file-input" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="pt-3 border-t border-slate-800 flex flex-col sm:flex-row justify-end gap-2.5">
                <button onclick="closeModal('homework-modal')" class="w-full sm:w-auto px-4 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold">Отмена</button>
                <button onclick="saveHomework()" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="pair-detail-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl sm:rounded-3xl max-w-lg w-full p-4 sm:p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center pb-2.5 border-b border-slate-800">
                <h3 id="detail-subject-title" class="text-sm sm:text-base font-bold text-white truncate pr-2">Информация о паре</h3>
                <button onclick="closeModal('pair-detail-modal')" class="text-slate-400 hover:text-white text-xl px-1">&times;</button>
            </div>
            <div id="pair-detail-content" class="space-y-3 text-xs sm:text-sm text-slate-300"></div>
            <div class="pt-3 border-t border-slate-800 flex justify-end">
                <button onclick="closeModal('pair-detail-modal')" class="w-full sm:w-auto px-5 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        let currentScheduleId = null;
        let currentPairSubgroup = null;
        let currentWeekFilter = 'odd'; // По умолчанию нечетная неделя
        const daysMap = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-info').textContent = `${user.full_name} (${user.role === 'admin' ? 'Староста' : user.role === 'kurator' ? 'Куратор' : 'Студент'})`;
            
            const today = new Date();
            document.getElementById('attendance-date').valueAsDate = today;
            
            loadSchedule();
        }

        // Функция переключения кнопок недели
        function setWeekFilter(week) {
            currentWeekFilter = week;
            
            // Сбрасываем стили всех кнопок
            ['odd', 'even', 'all'].forEach(w => {
                const btn = document.getElementById(`btn-week-${w}`);
                btn.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-white';
            });

            // Активируем выбранную кнопку
            const activeBtn = document.getElementById(`btn-week-${week}`);
            activeBtn.className = 'flex-1 sm:flex-none px-3 py-1.5 rounded-xl text-xs font-semibold transition bg-indigo-600 text-white shadow-sm';

            loadSchedule();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.reload();
                } else { alert(data.error || 'Ошибка входа'); }
            } catch (err) { alert('Ошибка сервера'); }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.reload();
        }

        function switchTab(tab) {
            const btn1 = document.getElementById('nav-btn-1');
            const btn2 = document.getElementById('nav-btn-2');
            const v1 = document.getElementById('view-schedule');
            const v2 = document.getElementById('view-stats');

            if (tab === 'schedule') {
                btn1.className = 'flex-1 sm:flex-none px-3.5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold transition';
                btn2.className = 'flex-1 sm:flex-none px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition';
                v1.classList.remove('hidden');
                v2.classList.add('hidden');
                loadSchedule();
            } else {
                btn2.className = 'flex-1 sm:flex-none px-3.5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold transition';
                btn1.className = 'flex-1 sm:flex-none px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition';
                v2.classList.remove('hidden');
                v1.classList.add('hidden');
                loadStats();
            }
        }

        document.getElementById('attendance-date').addEventListener('change', loadSchedule);

        async function loadSchedule() {
            const dateInput = document.getElementById('attendance-date').value;
            const selectedDateObj = new Date(dateInput);
            const dayOfWeek = daysMap[selectedDateObj.getDay()];
            
            try {
                const res = await fetch(`/api/schedule?week=${currentWeekFilter}&date=${dateInput}&day=${dayOfWeek}&user_id=${user.id}&role=${user.role}`);
                const schedule = await res.json();
                const container = document.getElementById('schedule-container');
                
                if (schedule.length === 0) {
                    container.innerHTML = `<div class="bg-slate-900/60 border border-slate-800 rounded-2xl sm:rounded-3xl p-8 text-center text-slate-400 text-xs sm:text-sm">Расписание на ${dayOfWeek} (${dateInput}) не найдено.</div>`;
                    return;
                }

                let completedMap = {};
                if (user.role === 'student') {
                    for (const item of schedule) {
                        const statusRes = await fetch(`/api/homework-status?student_id=${user.id}&date=${dateInput}&schedule_id=${item.id}`);
                        const statusData = await statusRes.json();
                        if (statusData.is_completed) completedMap[item.id] = true;
                    }
                }

                container.innerHTML = `
                    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                                <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></span>
                                ${dayOfWeek}, ${dateInput}
                            </h2>
                            <span class="text-xs text-slate-500 font-medium">${schedule.length} пары</span>
                        </div>
                        <div class="space-y-3">
                            ${schedule.map(item => {
                                const isDone = completedMap[item.id];
                                return `
                                    <div onclick="handlePairClick(${item.id}, '${item.subject.replace(/'/g, "\\'")}', '${(item.homework || '').replace(/'/g, "\\'")}', '${item.homework_file || ''}')" 
                                         class="p-3.5 sm:p-4 bg-slate-950/60 border ${isDone ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-slate-800/80'} rounded-2xl flex flex-col gap-3 hover:border-indigo-500/50 transition cursor-pointer">
                                        <div class="space-y-1">
                                            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                                                <span class="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-lg text-[11px] sm:text-xs font-semibold">Пара ${item.pair_number}</span>
                                                <span class="px-2 py-0.5 bg-slate-800 text-slate-300 rounded-lg text-[11px] sm:text-xs">Подгруппа: ${item.subgroup || 'Общая'}</span>
                                                ${isDone ? '<span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-[11px] font-semibold">✓ Выполнено</span>' : ''}
                                                <span class="text-[11px] sm:text-xs text-slate-500 ml-auto">${item.week_type === 'even' ? 'Четная' : 'Нечетная'}</span>
                                            </div>
                                            <h3 class="font-semibold text-white text-xs sm:text-sm mt-1">${item.subject}</h3>
                                            <p class="text-[11px] sm:text-xs text-slate-400">Преподаватель: <span class="text-slate-300">${item.teacher || 'Не указан'}</span></p>
                                            ${item.homework ? `
                                                <div class="mt-2 text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-900/30 p-2.5 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                                                    <span><b>ДЗ:</b> ${item.homework}</span>
                                                    ${item.homework_file ? `<a href="${item.homework_file}" target="_blank" onclick="event.stopPropagation()" class="text-indigo-400 hover:underline font-medium shrink-0">📎 Файл</a>` : ''}
                                                </div>
                                            ` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 w-full justify-between pt-2 border-t border-slate-900" onclick="event.stopPropagation()">
                                            ${user.role === 'student' && item.homework ? `
                                                <button onclick="toggleHomeworkStatus(${item.id}, ${!isDone})" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${isDone ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-emerald-600/20 text-emerald-400 border border-emerald-600/30 hover:bg-emerald-600 hover:text-white'}">
                                                    ${isDone ? 'Снять отметку' : '✓ Сделано'}
                                                </button>
                                            ` : '<div></div>'}
                                            
                                            ${user.role === 'admin' ? `
                                                <div class="flex items-center gap-2 ml-auto">
                                                    <button onclick="openAttendanceModal(${item.id}, '${item.subject.replace(/'/g, "\\'")}', '${item.subgroup || ''}')" class="px-3 py-2 bg-indigo-600/10 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-600/20 transition rounded-xl text-xs font-semibold">
                                                        Посещаемость
                                                    </button>
                                                    <button onclick="openHomeworkModal(${item.id}, '${(item.homework || '').replace(/'/g, "\\'")}', '${item.homework_file || ''}')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition rounded-xl text-xs font-medium">
                                                        ДЗ
                                                    </button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } catch (err) { console.error(err); }
        }

        async function toggleHomeworkStatus(scheduleId, isCompleted) {
            const date = document.getElementById('attendance-date').value;
            try {
                const res = await fetch('/api/homework-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: user.id, date, schedule_id: scheduleId, is_completed: isCompleted })
                });
                if (res.ok) { loadSchedule(); }
                else { alert('Ошибка обновления статуса'); }
            } catch (err) { alert('Ошибка сервера'); }
        }

        async function handlePairClick(scheduleId, subject, hw, file) {
            if (user.role === 'admin' || user.role === 'kurator') return; 
            
            const date = document.getElementById('attendance-date').value;
            document.getElementById('detail-subject-title').textContent = subject;
            const content = document.getElementById('pair-detail-content');
            
            content.innerHTML = '<p class="text-slate-400 text-xs">Загрузка информации...</p>';
            document.getElementById('pair-detail-modal').classList.remove('hidden');

            try {
                const [attRes, statusRes] = await Promise.all([
                    fetch(`/api/attendance?date=${date}&schedule_id=${scheduleId}`),
                    fetch(`/api/homework-status?student_id=${user.id}&date=${date}&schedule_id=${scheduleId}`)
                ]);
                const attendance = await attRes.json();
                const statusData = await statusRes.json();
                const myRecord = attendance.find(a => a.student_id === user.id);

                let statusText = '<span class="text-emerald-400 font-semibold">Присутствует / Не отмечен</span>';
                if (myRecord) {
                    if (myRecord.status === 'absent_invalid') statusText = '<span class="text-rose-400 font-semibold">Н (Неуважительная причина)</span>';
                    if (myRecord.status === 'absent_valid') statusText = '<span class="text-amber-400 font-semibold">Н (Уважительная причина)</span>';
                }

                content.innerHTML = `
                    <div class="space-y-3">
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <p class="text-[11px] text-slate-400 uppercase font-semibold mb-1">Ваш статус на ${date}:</p>
                            <p class="text-xs sm:text-sm">${statusText}</p>
                            ${myRecord && myRecord.comment ? `<p class="text-xs text-slate-400 mt-2"><b>Комментарий:</b> ${myRecord.comment}</p>` : ''}
                        </div>
                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
                            <div class="flex justify-between items-center">
                                <p class="text-[11px] text-slate-400 uppercase font-semibold">Домашнее задание:</p>
                                <span class="text-xs font-semibold ${statusData.is_completed ? 'text-emerald-400' : 'text-slate-500'}">${statusData.is_completed ? '✓ Выполнено вами' : 'Не выполнено'}</span>
                            </div>
                            <p class="text-white text-xs sm:text-sm">${hw || 'Не задано'}</p>
                            ${file ? `<div><a href="${file}" target="_blank" class="text-indigo-400 hover:underline text-xs font-semibold inline-flex items-center gap-1">📎 Открыть файл</a></div>` : ''}
                        </div>
                    </div>
                `;
            } catch (err) { content.innerHTML = '<p class="text-rose-400 text-xs">Ошибка загрузки</p>'; }
        }

        let editScheduleId = null;
        function openHomeworkModal(id, hw, file) {
            editScheduleId = id;
            document.getElementById('hw-text-input').value = hw;
            document.getElementById('hw-file-input').value = file;
            document.getElementById('homework-modal').classList.remove('hidden');
        }

        async function saveHomework() {
            const date = document.getElementById('attendance-date').value;
            const homework = document.getElementById('hw-text-input').value;
            const homework_file = document.getElementById('hw-file-input').value;
            try {
                const res = await fetch('/api/schedule/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ schedule_id: editScheduleId, date, homework, homework_file, userRole: user.role })
                });
                if (res.ok) { closeModal('homework-modal'); loadSchedule(); }
                else { alert('Ошибка сохранения ДЗ'); }
            } catch (err) { alert('Ошибка сервера'); }
        }

        async function openAttendanceModal(scheduleId, subjectName, subgroup) {
            currentScheduleId = scheduleId;
            currentPairSubgroup = subgroup ? subgroup.trim() : '';
            const date = document.getElementById('attendance-date').value;
            
            let subTitle = currentPairSubgroup ? ` (Подгруппа ${currentPairSubgroup})` : ' (Общая пара)';
            document.getElementById('modal-title').textContent = `${subjectName}${subTitle} — ${date}`;
            
            try {
                const [studentsRes, attRes] = await Promise.all([
                    fetch('/api/students'),
                    fetch(`/api/attendance?date=${date}&schedule_id=${scheduleId}`)
                ]);
                let students = await studentsRes.json();
                const attendance = await attRes.json();
                
                if (currentPairSubgroup && currentPairSubgroup !== 'Общая' && currentPairSubgroup !== '') {
                    students = students.filter(s => String(s.subgroup) === String(currentPairSubgroup));
                }

                const attMap = {};
                attendance.forEach(a => { attMap[a.student_id] = a; });

                const container = document.getElementById('students-container');
                if (students.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-xs text-center py-4">В этой подгруппе не найдено студентов.</p>';
                } else {
                    container.innerHTML = students.map(s => {
                        const record = attMap[s.id] || { status: 'present', comment: '' };
                        return `
                            <div class="py-3 px-1 flex flex-col gap-2 student-row" data-id="${s.id}">
                                <div>
                                    <p class="font-medium text-xs text-white">${s.name}</p>
                                    <span class="text-[10px] text-slate-500">Подгруппа: ${s.subgroup || 1}</span>
                                </div>
                                <div class="flex items-center gap-2 w-full">
                                    <select class="status-select flex-1 bg-slate-950 border border-slate-800 text-xs px-2.5 py-2 rounded-xl text-white">
                                        <option value="present" ${record.status === 'present' ? 'selected' : ''}>Присутствует</option>
                                        <option value="absent_invalid" ${record.status === 'absent_invalid' ? 'selected' : ''}>Н (неув)</option>
                                        <option value="absent_valid" ${record.status === 'absent_valid' ? 'selected' : ''}>Н (ув)</option>
                                    </select>
                                    <input type="text" placeholder="Комментарий" value="${record.comment || ''}" class="comment-input w-28 bg-slate-950 border border-slate-800 text-xs px-2.5 py-2 rounded-xl text-white">
                                </div>
                            </div>
                        `;
                    }).join('');
                }
                document.getElementById('attendance-modal').classList.remove('hidden');
            } catch (err) { alert('Ошибка загрузки'); }
        }

        async function saveAttendance() {
            const date = document.getElementById('attendance-date').value;
            const rows = document.querySelectorAll('.student-row');
            const records = [];

            rows.forEach(row => {
                records.push({
                    student_id: row.getAttribute('data-id'),
                    status: row.querySelector('.status-select').value,
                    comment: row.querySelector('.comment-input').value
                });
            });

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, schedule_id: currentScheduleId, records, userRole: user.role })
                });
                if (res.ok) { closeModal('attendance-modal'); alert('Сохранено!'); }
                else { alert('Ошибка'); }
            } catch (err) { alert('Ошибка сервера'); }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        async function loadStats() {
            const title = document.getElementById('stats-title');
            const container = document.getElementById('stats-container');

            if (user.role === 'admin' || user.role === 'kurator') {
                title.textContent = 'Статистика группы (нажмите на студента)';
                try {
                    const res = await fetch('/api/stats');
                    const stats = await res.json();
                    container.innerHTML = `
                        <table class="w-full text-left border-collapse text-xs whitespace-nowrap sm:whitespace-normal">
                            <thead>
                                <tr class="border-b border-slate-800 text-slate-500 uppercase">
                                    <th class="py-3 px-3">Студент</th>
                                    <th class="py-3 px-3 text-center">Подгр.</th>
                                    <th class="py-3 px-3 text-center">Н (неув.)</th>
                                    <th class="py-3 px-3 text-center">Н (ув.)</th>
                                    <th class="py-3 px-3 text-center">Всего</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                                ${stats.map(s => `
                                    <tr onclick="openStudentAbsences(${s.student_id}, '${s.name.replace(/'/g, "\\'")}')" class="hover:bg-slate-800/40 cursor-pointer transition">
                                        <td class="py-3.5 px-3 font-medium text-indigo-400 underline">${s.name}</td>
                                        <td class="py-3.5 px-3 text-center text-slate-400">${s.subgroup || 1}</td>
                                        <td class="py-3.5 px-3 text-center text-rose-400 font-semibold">${s.invalid_absences || 0}</td>
                                        <td class="py-3.5 px-3 text-center text-amber-400 font-semibold">${s.valid_absences || 0}</td>
                                        <td class="py-3.5 px-3 text-center font-bold text-white">${s.total_absences || 0}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } catch (err) { container.innerHTML = '<p class="text-rose-400 text-xs">Ошибка загрузки</p>'; }
            } else {
                title.textContent = 'Моя история пропусков';
                try {
                    const res = await fetch(`/api/student-absences?student_id=${user.id}`);
                    const absences = await res.json();
                    if (absences.length === 0) {
                        container.innerHTML = '<p class="text-slate-400 text-xs sm:text-sm">У вас нет отмеченных пропусков.</p>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="w-full text-left border-collapse text-xs whitespace-nowrap sm:whitespace-normal">
                            <thead>
                                <tr class="border-b border-slate-800 text-slate-500 uppercase">
                                    <th class="py-3 px-3">Дата</th>
                                    <th class="py-3 px-3">День</th>
                                    <th class="py-3 px-3">Пара</th>
                                    <th class="py-3 px-3">Предмет</th>
                                    <th class="py-3 px-3">Статус</th>
                                    <th class="py-3 px-3">Комментарий</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                                ${absences.map(a => `
                                    <tr class="hover:bg-slate-800/20">
                                        <td class="py-3.5 px-3 text-slate-300">${a.date}</td>
                                        <td class="py-3.5 px-3 text-white font-medium">${a.day_of_week}</td>
                                        <td class="py-3.5 px-3 text-slate-400">Пара ${a.pair_number}</td>
                                        <td class="py-3.5 px-3 text-white">${a.subject}</td>
                                        <td class="py-3.5 px-3 font-semibold ${a.status === 'absent_invalid' ? 'text-rose-400' : 'text-amber-400'}">
                                            ${a.status === 'absent_invalid' ? 'Н (неув.)' : 'Н (ув.)'}
                                        </td>
                                        <td class="py-3.5 px-3 text-slate-400">${a.comment || '—'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } catch (err) { container.innerHTML = '<p class="text-rose-400 text-xs">Ошибка загрузки</p>'; }
            }
        }

        async function openStudentAbsences(studentId, studentName) {
            document.getElementById('student-modal-title').textContent = `Пропуска: ${studentName}`;
            const container = document.getElementById('student-absences-container');
            container.innerHTML = '<p class="text-slate-400 text-xs">Загрузка...</p>';
            document.getElementById('student-detail-modal').classList.remove('hidden');

            try {
                const res = await fetch(`/api/student-absences?student_id=${studentId}`);
                const absences = await res.json();

                if (absences.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-xs">У этого студента нет пропусков.</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap sm:whitespace-normal">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-500 uppercase">
                                <th class="py-2.5 px-2">Дата</th>
                                <th class="py-2.5 px-2">День</th>
                                <th class="py-2.5 px-2">Пара</th>
                                <th class="py-2.5 px-2">Предмет</th>
                                <th class="py-2.5 px-2">Статус</th>
                                <th class="py-2.5 px-2">Комментарий</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/50">
                            ${absences.map(a => `
                                <tr class="hover:bg-slate-800/20">
                                    <td class="py-3 px-2 text-slate-300">${a.date}</td>
                                    <td class="py-3 px-2 text-white">${a.day_of_week}</td>
                                    <td class="py-3 px-2 text-slate-400">${a.pair_number}</td>
                                    <td class="py-3 px-2 text-white">${a.subject}</td>
                                    <td class="py-3 px-2 font-semibold ${a.status === 'absent_invalid' ? 'text-rose-400' : 'text-amber-400'}">
                                        ${a.status === 'absent_invalid' ? 'Н (неув.)' : 'Н (ув.)'}
                                    </td>
                                    <td class="py-3 px-2 text-slate-400">${a.comment || '—'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                container.innerHTML = '<p class="text-rose-400 text-xs">Ошибка загрузки</p>';
            }
        }
    </script>
</body>
</html>
