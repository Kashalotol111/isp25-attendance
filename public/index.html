<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт посещаемости — ИСП-О-25</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Форма авторизации -->
    <div id="login-view" class="flex items-center justify-center min-h-screen">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold tracking-wide">Группа ИСП-О-25</h1>
                <p class="text-slate-400 text-sm mt-1">Система учёта посещаемости</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Логин</label>
                    <input type="text" id="login" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Пароль</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 transition rounded-xl font-semibold text-white shadow-lg shadow-indigo-600/30">
                    Войти в систему
                </button>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app-view" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white">Учёт посещаемости: ИСП-О-25</h1>
                <p id="user-info" class="text-xs text-slate-400 mt-0.5"></p>
            </div>
            <div class="flex items-center gap-3">
                <button id="stats-tab-btn" onclick="toggleStats()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 transition rounded-xl text-sm font-medium">Статистика</button>
                <button onclick="logout()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white transition rounded-xl text-sm font-medium border border-rose-600/30">Выйти</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-6xl mx-auto w-full space-y-6">
            <!-- Панель фильтров -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-slate-300">Дата:</label>
                    <input type="date" id="attendance-date" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-slate-300">Неделя:</label>
                    <select id="week-filter" onchange="loadSchedule()" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500">
                        <option value="all">Все недели</option>
                        <option value="even">Четная (even)</option>
                        <option value="odd">Нечетная (odd)</option>
                    </select>
                </div>
            </div>

            <!-- Основной контент: Расписание / Статистика -->
            <div id="main-content" class="space-y-4">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-lg font-semibold mb-4">Расписание пар</h2>
                    <div id="schedule-container" class="space-y-3">
                        <p class="text-slate-400 text-sm">Загрузка...</p>
                    </div>
                </div>
            </div>

            <!-- Модальное окно для отметки посещаемости -->
            <div id="attendance-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="modal-title" class="text-lg font-bold text-white">Отметка посещаемости</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
                    </div>
                    <div id="students-container" class="flex-1 overflow-y-auto space-y-3 pr-2 divide-y divide-slate-700/50">
                        <!-- Список студентов загружается динамически -->
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-700 flex justify-end gap-3">
                        <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-medium">Отмена</button>
                        <button onclick="saveAttendance()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30">Сохранить</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        let currentScheduleId = null;

        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-info').textContent = `${user.full_name} (${user.role === 'admin' ? 'Староста' : user.role})`;
            document.getElementById('attendance-date').valueAsDate = new Date();
            loadSchedule();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.reload();
                } else {
                    alert(data.error || 'Ошибка входа');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.reload();
        }

        async function loadSchedule() {
            const week = document.getElementById('week-filter').value;
            try {
                const res = await fetch(`/api/schedule?week=${week}`);
                const schedule = await res.json();
                const container = document.getElementById('schedule-container');
                
                if (schedule.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-sm">Расписание не найдено.</p>';
                    return;
                }

                container.innerHTML = schedule.map(item => `
                    <div class="p-4 bg-slate-900 border border-slate-700/60 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span class="text-xs font-semibold text-indigo-400 uppercase">${item.day_of_week} • Пара ${item.pair_number} (${item.week_type})</span>
                            <h3 class="font-bold text-white text-base mt-0.5">${item.subject}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Преподаватель: ${item.teacher || 'Не указан'}</p>
                            ${item.homework ? `<p class="text-xs text-emerald-400 mt-2 bg-emerald-950/40 border border-emerald-800/40 p-2 rounded-lg"><b>ДЗ:</b> ${item.homework}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            ${user.role === 'admin' ? `
                                <button onclick="openAttendanceModal(${item.id}, '${item.subject}')" class="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-600/30 transition rounded-xl text-xs font-semibold">
                                    Отметить посещаемость
                                </button>
                                <button onclick="editHomework(${item.id}, '${item.homework || ''}')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition rounded-xl text-xs font-medium">
                                    ДЗ
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Ошибка загрузки расписания:', err);
            }
        }

        async function openAttendanceModal(scheduleId, subjectName) {
            currentScheduleId = scheduleId;
            const date = document.getElementById('attendance-date').value;
            document.getElementById('modal-title').textContent = `Посещаемость: ${subjectName} (${date})`;
            
            try {
                const [studentsRes, attRes] = await Promise.all([
                    fetch('/api/students'),
                    fetch(`/api/attendance?date=${date}&schedule_id=${scheduleId}`)
                ]);
                const students = await studentsRes.json();
                const attendance = await attRes.json();
                
                const attMap = {};
                attendance.forEach(a => { attMap[a.student_id] = a; });

                const container = document.getElementById('students-container');
                container.innerHTML = students.map(s => {
                    const record = attMap[s.id] || { status: 'present', comment: '' };
                    return `
                        <div class="py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 student-row" data-id="${s.id}">
                            <div>
                                <p class="font-medium text-sm text-white">${s.name}</p>
                                <span class="text-xs text-slate-400">Подгруппа: ${s.subgroup || 1}</span>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                                <select class="status-select bg-slate-900 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-white">
                                    <option value="present" ${record.status === 'present' ? 'selected' : ''}>Присутствует</option>
                                    <option value="absent_invalid" ${record.status === 'absent_invalid' ? 'selected' : ''}>Н (неув)</option>
                                    <option value="absent_valid" ${record.status === 'absent_valid' ? 'selected' : ''}>Н (ув)</option>
                                </select>
                                <input type="text" placeholder="Комментарий" value="${record.comment || ''}" class="comment-input bg-slate-900 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-white w-28">
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('attendance-modal').classList.remove('hidden');
            } catch (err) {
                alert('Ошибка загрузки данных студентов');
            }
        }

        function closeModal() {
            document.getElementById('attendance-modal').classList.add('hidden');
        }

        async function saveAttendance() {
            const date = document.getElementById('attendance-date').value;
            const rows = document.querySelectorAll('.student-row');
            const records = [];

            rows.forEach(row => {
                const student_id = row.getAttribute('data-id');
                const status = row.querySelector('.status-select').value;
                const comment = row.querySelector('.comment-input').value;
                records.push({ student_id, status, comment });
            });

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date,
                        schedule_id: currentScheduleId,
                        records,
                        userRole: user.role
                    })
                });
                if (res.ok) {
                    closeModal();
                    alert('Посещаемость успешно сохранена!');
                } else {
                    const err = await res.json();
                    alert(err.error || 'Ошибка сохранения');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        async function editHomework(scheduleId, currentHw) {
            const hw = prompt('Введите домашнее задание:', currentHw);
            if (hw === null) return;

            try {
                const res = await fetch('/api/schedule/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        schedule_id: scheduleId,
                        homework: hw,
                        is_cancelled: false,
                        userRole: user.role
                    })
                });
                if (res.ok) {
                    loadSchedule();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Ошибка обновления ДЗ');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        async function toggleStats() {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold">Статистика пропусков</h2>
                        <button onclick="loadSchedule(); document.getElementById('main-content').innerHTML = '<div class=\\'bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl\\'><h2 class=\\'text-lg font-semibold mb-4\\'>Расписание пар</h2><div id=\\'schedule-container\\' class=\\'space-y-3\\'></div></div>'; loadSchedule();" class="text-xs text-indigo-400 hover:underline">← Назад к расписанию</button>
                    </div>
                    <div id="stats-container" class="overflow-x-auto">
                        <p class="text-slate-400 text-sm">Загрузка статистики...</p>
                    </div>
                </div>
            `;

            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                const container = document.getElementById('stats-container');

                if (stats.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-sm">Нет данных для статистики.</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
                                <th class="py-3 px-4">Студент</th>
                                <th class="py-3 px-4 text-center">Подгруппа</th>
                                <th class="py-3 px-4 text-center">Н (неув.)</th>
                                <th class="py-3 px-4 text-center">Н (ув.)</th>
                                <th class="py-3 px-4 text-center">Всего пропусков</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            ${stats.map(s => `
                                <tr class="hover:bg-slate-900/40">
                                    <td class="py-3 px-4 font-medium text-white">${s.name}</td>
                                    <td class="py-3 px-4 text-center text-slate-400">${s.subgroup || 1}</td>
                                    <td class="py-3 px-4 text-center text-rose-400 font-semibold">${s.invalid_absences || 0}</td>
                                    <td class="py-3 px-4 text-center text-amber-400 font-semibold">${s.valid_absences || 0}</td>
                                    <td class="py-3 px-4 text-center font-bold text-white">${s.total_absences || 0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('Ошибка загрузки статистики:', err);
            }
        }
    </script>
</body>
</html>
