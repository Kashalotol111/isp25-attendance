<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт посещаемости — ИСП-О-25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">

    <!-- Форма авторизации -->
    <div id="login-view" class="flex items-center justify-center min-h-screen px-4">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 pointer-events-none"></div>
        <div class="relative bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800">
            <div class="mb-8 text-center">
                <div class="w-12 h-12 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl mx-auto flex items-center justify-center mb-4 text-indigo-400 font-bold text-xl shadow-lg shadow-indigo-500/10">25</div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Группа ИСП-О-25</h1>
                <p class="text-slate-400 text-sm mt-1">Система учёта посещаемости и расписания</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Логин</label>
                    <input type="text" id="login" required class="w-full px-4 py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Пароль</label>
                    <input type="password" id="password" required class="w-full px-4 py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white transition">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 transition rounded-2xl font-semibold text-white shadow-xl shadow-indigo-600/20 active:scale-[0.98]">
                    Войти в систему
                </button>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app-view" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white text-sm shadow-md shadow-indigo-600/30">25</div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-tight">ИСП-О-25</h1>
                    <p id="user-info" class="text-xs text-slate-400 font-medium"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="stats-tab-btn" onclick="toggleStats()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700/80 text-slate-200 transition rounded-xl text-xs font-semibold border border-slate-700/50">Статистика</button>
                <button onclick="logout()" class="px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 transition rounded-xl text-xs font-semibold border border-rose-500/20">Выйти</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-5xl mx-auto w-full space-y-6">
            <!-- Панель управления / фильтры -->
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-3xl p-5 flex flex-wrap gap-4 items-center justify-between shadow-lg">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Дата:</span>
                    <input type="date" id="attendance-date" class="bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-2xl text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Неделя:</span>
                    <select id="week-filter" onchange="loadSchedule()" class="bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-2xl text-white text-sm focus:outline-none focus:border-indigo-500">
                        <option value="all">Все недели</option>
                        <option value="even">Четная (even)</option>
                        <option value="odd">Нечетная (odd)</option>
                    </select>
                </div>
            </div>

            <!-- Контент (расписание по дням или статистика) -->
            <div id="main-content" class="space-y-6">
                <div id="schedule-container" class="space-y-6">
                    <p class="text-slate-400 text-sm text-center py-10">Загрузка расписания...</p>
                </div>
            </div>

            <!-- Модальное окно посещаемости -->
            <div id="attendance-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                        <h3 id="modal-title" class="text-base font-bold text-white">Отметка посещаемости</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl p-1">&times;</button>
                    </div>
                    <div id="students-container" class="flex-1 overflow-y-auto space-y-2.5 pr-1 divide-y divide-slate-800/50"></div>
                    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end gap-3">
                        <button onclick="closeModal()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl text-xs font-semibold transition">Отмена</button>
                        <button onclick="saveAttendance()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-semibold shadow-lg shadow-indigo-600/30 transition">Сохранить</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        let currentScheduleId = null;

        if (user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-info').textContent = `${user.full_name} (${user.role === 'admin' ? 'Староста' : user.role})`;
            document.getElementById('attendance-date').valueAsDate = new Date();
            loadSchedule();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.reload();
                } else {
                    alert(data.error || 'Ошибка входа');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.reload();
        }

        async function loadSchedule() {
            const week = document.getElementById('week-filter').value;
            try {
                const res = await fetch(`/api/schedule?week=${week}`);
                const schedule = await res.json();
                const container = document.getElementById('schedule-container');
                
                if (schedule.length === 0) {
                    container.innerHTML = '<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-10 text-center text-slate-400 text-sm">Расписание не найдено.</div>';
                    return;
                }

                // Группируем пары по дням недели
                const daysOrder = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
                const grouped = {};
                schedule.forEach(item => {
                    if (!grouped[item.day_of_week]) grouped[item.day_of_week] = [];
                    grouped[item.day_of_week].push(item);
                });

                container.innerHTML = daysOrder.filter(day => grouped[day]).map(day => `
                    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h2 class="text-base font-bold text-white flex items-center gap-2">
                                <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></span>
                                ${day}
                            </h2>
                            <span class="text-xs text-slate-500 font-medium">${grouped[day].length} пары</span>
                        </div>
                        <div class="space-y-3">
                            ${grouped[day].map(item => `
                                <div class="p-4 bg-slate-950/60 border border-slate-800/80 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-700 transition">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2">
                                            <span class="px-2.5 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-lg text-xs font-semibold">Пара ${item.pair_number}</span>
                                            <span class="text-xs text-slate-500">${item.week_type === 'even' ? 'Четная' : 'Нечетная'}</span>
                                        </div>
                                        <h3 class="font-semibold text-white text-sm">${item.subject}</h3>
                                        <p class="text-xs text-slate-400">Преподаватель: <span class="text-slate-300">${item.teacher || 'Не указан'}</span></p>
                                        ${item.homework ? `
                                            <div class="mt-2 text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-900/30 p-2.5 rounded-xl flex items-center justify-between gap-2">
                                                <span><b>ДЗ:</b> ${item.homework}</span>
                                                ${item.homework_file ? `<a href="${item.homework_file}" target="_blank" class="text-indigo-400 hover:underline font-medium shrink-0">📎 Файл</a>` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center gap-2 w-full md:w-auto justify-end shrink-0">
                                        ${user.role === 'admin' ? `
                                            <button onclick="openAttendanceModal(${item.id}, '${item.subject}')" class="px-4 py-2 bg-indigo-600/10 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-600/20 transition rounded-xl text-xs font-semibold">
                                                Посещаемость
                                            </button>
                                            <button onclick="editHomework(${item.id}, '${item.homework || ''}', '${item.homework_file || ''}')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition rounded-xl text-xs font-medium">
                                                ДЗ и файл
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Ошибка загрузки расписания:', err);
            }
        }

        async function openAttendanceModal(scheduleId, subjectName) {
            currentScheduleId = scheduleId;
            const date = document.getElementById('attendance-date').value;
            document.getElementById('modal-title').textContent = `Посещаемость: ${subjectName} (${date})`;
            
            try {
                const [studentsRes, attRes] = await Promise.all([
                    fetch('/api/students'),
                    fetch(`/api/attendance?date=${date}&schedule_id=${scheduleId}`)
                ]);
                const students = await studentsRes.json();
                const attendance = await attRes.json();
                
                const attMap = {};
                attendance.forEach(a => { attMap[a.student_id] = a; });

                const container = document.getElementById('students-container');
                container.innerHTML = students.map(s => {
                    const record = attMap[s.id] || { status: 'present', comment: '' };
                    return `
                        <div class="py-2.5 px-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 student-row" data-id="${s.id}">
                            <div>
                                <p class="font-medium text-xs text-white">${s.name}</p>
                                <span class="text-[10px] text-slate-500">Подгруппа: ${s.subgroup || 1}</span>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                                <select class="status-select bg-slate-950 border border-slate-800 text-xs px-2.5 py-1.5 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                                    <option value="present" ${record.status === 'present' ? 'selected' : ''}>Присутствует</option>
                                    <option value="absent_invalid" ${record.status === 'absent_invalid' ? 'selected' : ''}>Н (неув)</option>
                                    <option value="absent_valid" ${record.status === 'absent_valid' ? 'selected' : ''}>Н (ув)</option>
                                </select>
                                <input type="text" placeholder="Комментарий" value="${record.comment || ''}" class="comment-input bg-slate-950 border border-slate-800 text-xs px-2.5 py-1.5 rounded-xl text-white w-28 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('attendance-modal').classList.remove('hidden');
            } catch (err) {
                alert('Ошибка загрузки данных студентов');
            }
        }

        function closeModal() {
            document.getElementById('attendance-modal').classList.add('hidden');
        }

        async function saveAttendance() {
            const date = document.getElementById('attendance-date').value;
            const rows = document.querySelectorAll('.student-row');
            const records = [];

            rows.forEach(row => {
                const student_id = row.getAttribute('data-id');
                const status = row.querySelector('.status-select').value;
                const comment = row.querySelector('.comment-input').value;
                records.push({ student_id, status, comment });
            });

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date,
                        schedule_id: currentScheduleId,
                        records,
                        userRole: user.role
                    })
                });
                if (res.ok) {
                    closeModal();
                    alert('Посещаемость успешно сохранена!');
                } else {
                    const err = await res.json();
                    alert(err.error || 'Ошибка сохранения');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        async function editHomework(scheduleId, currentHw, currentFile) {
            const hw = prompt('Введите домашнее задание:', currentHw);
            if (hw === null) return;
            const fileUrl = prompt('Введите ссылку на файл с ДЗ (или оставьте пустым):', currentFile);
            if (fileUrl === null) return;

            try {
                const res = await fetch('/api/schedule/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        schedule_id: scheduleId,
                        homework: hw,
                        homework_file: fileUrl,
                        is_cancelled: false,
                        userRole: user.role
                    })
                });
                if (res.ok) {
                    loadSchedule();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Ошибка обновления ДЗ');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        async function toggleStats() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <h2 class="text-base font-bold text-white">Статистика пропусков</h2>
                        <button onclick="loadSchedule();" class="text-xs text-indigo-400 hover:underline font-medium">← Назад к расписанию</button>
                    </div>
                    <div id="stats-container" class="overflow-x-auto">
                        <p class="text-slate-400 text-sm">Загрузка статистики...</p>
                    </div>
                </div>
            `;

            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                const statContainer = document.getElementById('stats-container');

                if (stats.length === 0) {
                    statContainer.innerHTML = '<p class="text-slate-400 text-sm">Нет данных для статистики.</p>';
                    return;
                }

                statContainer.innerHTML = `
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-500 uppercase tracking-wider">
                                <th class="py-3 px-4">Студент</th>
                                <th class="py-3 px-4 text-center">Подгруппа</th>
                                <th class="py-3 px-4 text-center">Н (неув.)</th>
                                <th class="py-3 px-4 text-center">Н (ув.)</th>
                                <th class="py-3 px-4 text-center">Всего пропусков</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/50">
                            ${stats.map(s => `
                                <tr class="hover:bg-slate-800/20 transition">
                                    <td class="py-3.5 px-4 font-medium text-white">${s.name}</td>
                                    <td class="py-3.5 px-4 text-center text-slate-400">${s.subgroup || 1}</td>
                                    <td class="py-3.5 px-4 text-center text-rose-400 font-semibold">${s.invalid_absences || 0}</td>
                                    <td class="py-3.5 px-4 text-center text-amber-400 font-semibold">${s.valid_absences || 0}</td>
                                    <td class="py-3.5 px-4 text-center font-bold text-white">${s.total_absences || 0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('Ошибка загрузки статистики:', err);
            }
        }
    </script>
</body>
</html>
