<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт посещаемости — ИСП-О-25</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Авторизация -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-1 text-white">Группа ИСП-О-25</h2>
            <p class="text-slate-400 text-sm mb-6">Введите персональные учетные данные</p>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Логин</label>
                    <input type="text" id="login-input" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Пароль</label>
                    <input type="password" id="password-input" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm">Войти в систему</button>
            </form>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="main-app" class="hidden max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        <header class="flex justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
            <div>
                <h1 class="text-lg font-bold text-white">Журнал посещаемости ИСП-О-25</h1>
                <p id="user-badge" class="text-xs text-indigo-400 font-medium mt-0.5"></p>
            </div>
            <div class="flex items-center gap-2">
                <button id="stats-btn" onclick="openStatsModal()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-lg transition font-medium">📊 Статистика и выгрузка</button>
                <button id="student-stats-btn" onclick="openStudentStatsModal()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2 rounded-lg transition font-medium">📅 Мои пропуски за месяц</button>
                <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg border border-slate-600 transition">Выйти</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 mb-1">Выберите неделю</label>
                <select id="week-select" onchange="loadSchedule()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="odd">Нечетная неделя</option>
                    <option value="even">Четная неделя</option>
                </select>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 mb-1">День недели</label>
                <select id="day-select" onchange="renderSchedule()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="all">Все дни недели</option>
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                </select>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 mb-1">Дата занятий</label>
                <input type="date" id="selected-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white">
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow">
            <h3 class="text-sm font-bold text-white mb-4">Расписание пар</h3>
            <div id="schedule-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- Модальное окно отметки посещаемости -->
    <div id="attendance-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <div>
                    <h3 id="modal-title" class="font-bold text-lg text-white">Пара</h3>
                    <p id="modal-subtitle" class="text-xs text-slate-400"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>

            <!-- Строка поиска скрывается для студентов -->
            <div id="search-container" class="my-3">
                <input type="text" id="student-search" oninput="filterStudentsList()" placeholder="Поиск студента по фамилии..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
            </div>

            <div class="my-2 space-y-2 overflow-y-auto flex-1 pr-2" id="modal-students-container"></div>

            <div class="pt-4 border-t border-slate-700 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-300 hover:bg-slate-700 rounded-lg transition">Закрыть</button>
                <button id="save-attendance-btn" onclick="saveAttendance()" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition">Сохранить отметки</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно статистики старосты/куратора -->
    <div id="stats-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h3 class="font-bold text-lg text-white">Статистика пропусков группы ИСП-О-25</h3>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="my-4 overflow-y-auto flex-1 pr-2" id="stats-container"></div>
            <div class="pt-4 border-t border-slate-700 flex justify-between items-center">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg transition font-medium flex items-center gap-2">📥 Скачать отчёт в Excel (CSV)</button>
                <button onclick="closeStatsModal()" class="px-4 py-2 text-xs font-medium text-slate-300 hover:bg-slate-700 rounded-lg transition">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно личной статистики студента за месяц -->
    <div id="student-stats-modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h3 class="font-bold text-lg text-white">Мои пропуски (Энки) за месяц</h3>
                <button onclick="closeStudentStatsModal()" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>

            <div class="my-3 flex items-center gap-3">
                <label class="text-xs text-slate-400">Выберите месяц:</label>
                <input type="month" id="stats-month-input" onchange="loadStudentStats()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white">
            </div>

            <div class="my-2 space-y-2 overflow-y-auto flex-1 pr-2" id="student-stats-container">
                <p class="text-sm text-slate-400 text-center py-4">Загрузка...</p>
            </div>

            <div class="pt-4 border-t border-slate-700 flex justify-end">
                <button onclick="closeStudentStatsModal()" class="px-4 py-2 text-xs font-medium text-slate-300 hover:bg-slate-700 rounded-lg transition">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allStudents = [];
        let scheduleCache = [];
        let activePairId = null;
        let statsCache = [];

        document.getElementById('selected-date').valueAsDate = new Date();
        document.getElementById('stats-month-input').value = new Date().toISOString().slice(0, 7);

        async function handleLogin(e) {
            e.preventDefault();
            const login = document.getElementById('login-input').value.trim();
            const password = document.getElementById('password-input').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();
                if (res.ok) {
                    currentUser = data;
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-badge').innerText = `${currentUser.full_name} (${getRoleName(currentUser.role)})`;
                    
                    if (currentUser.role === 'admin' || currentUser.role === 'kurator') {
                        document.getElementById('stats-btn').classList.remove('hidden');
                    } else {
                        document.getElementById('student-stats-btn').classList.remove('hidden');
                    }

                    await loadStudents();
                    await loadSchedule();
                } else {
                    alert(data.error || 'Ошибка входа');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        function getRoleName(role) {
            if (role === 'admin') return 'Староста / Администратор';
            if (role === 'kurator') return 'Куратор';
            return 'Студент';
        }

        function logout() { location.reload(); }

        async function loadStudents() {
            try {
                const res = await fetch('/api/students');
                allStudents = await res.json();
            } catch (err) {
                console.error('Ошибка загрузки студентов', err);
            }
        }

        async function loadSchedule() {
            const weekType = document.getElementById('week-select').value;
            try {
                const res = await fetch(`/api/schedule?week=${weekType}`);
                scheduleCache = await res.json();
                renderSchedule();
            } catch (err) {
                console.error('Ошибка загрузки расписания', err);
            }
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = '';

            const selectedDay = document.getElementById('day-select').value;
            let filtered = scheduleCache;

            if (selectedDay !== 'all') {
                filtered = scheduleCache.filter(s => s.day_of_week === selectedDay);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 py-4 text-center">На выбранный день нет пар в расписании.</p>`;
                return;
            }

            filtered.forEach(pair => {
                const item = document.createElement('div');
                item.className = "bg-slate-900/60 border border-slate-700/60 rounded-lg p-3.5 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 hover:border-indigo-500 transition";
                item.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded">${pair.day_of_week} | Пара #${pair.pair_number}</span>
                            <span class="text-xs text-slate-400">${pair.start_time} - ${pair.end_time}</span>
                            <span class="text-xs text-slate-500 uppercase">(${pair.type})</span>
                        </div>
                        <h4 class="font-medium text-white text-sm">${pair.subject}</h4>
                        <p class="text-xs text-slate-400 mt-0.5">Ауд. ${pair.room || '—'} | Преп. ${pair.teacher || '—'} ${pair.subgroup ? `| Подгруппа ${pair.subgroup}` : ''}</p>
                    </div>
                    <button onclick="openAttendanceModal(${pair.id})" class="bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs px-3.5 py-2 rounded-lg transition font-medium">
                        ${currentUser.role === 'kurator' || currentUser.role === 'student' ? 'Посмотреть журнал' : 'Отметить посещаемость'}
                    </button>
                `;
                container.appendChild(item);
            });
        }

        async function openAttendanceModal(scheduleId) {
            activePairId = scheduleId;
            const pair = scheduleCache.find(s => s.id === scheduleId);
            if (!pair) return;

            document.getElementById('modal-title').innerText = `${pair.day_of_week} — Пара №${pair.pair_number}: ${pair.subject}`;
            document.getElementById('modal-subtitle').innerText = `${pair.start_time} - ${pair.end_time} | Преподаватель: ${pair.teacher || '—'}`;

            // Скрываем строку поиска для обычных студентов
            if (currentUser.role === 'student') {
                document.getElementById('search-container').classList.add('hidden');
            } else {
                document.getElementById('search-container').classList.remove('hidden');
            }

            const dateVal = document.getElementById('selected-date').value;
            let attendanceRecords = [];
            try {
                const res = await fetch(`/api/attendance?date=${dateVal}&schedule_id=${scheduleId}`);
                attendanceRecords = await res.json();
            } catch (err) {
                console.error('Ошибка загрузки посещаемости', err);
            }

            const recordMap = {};
            attendanceRecords.forEach(r => { recordMap[r.student_id] = r.status; });

            const container = document.getElementById('modal-students-container');
            container.innerHTML = '';

            let listToRender = allStudents;
            if (currentUser.role === 'student') {
                listToRender = allStudents.filter(st => st.id === currentUser.id);
            }

            listToRender.forEach(st => {
                const status = recordMap[st.id] || 'present';

                const row = document.createElement('div');
                row.className = "student-row flex items-center justify-between bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/50";
                row.innerHTML = `
                    <div>
                        <span class="text-sm font-medium text-slate-200">${st.name}</span>
                        <span class="text-xs text-slate-500 ml-2">(${st.subgroup} подгр.)</span>
                    </div>
                    <select data-student-id="${st.id}" class="status-select bg-slate-800 border border-slate-700 text-xs rounded px-2 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" ${currentUser.role === 'kurator' || currentUser.role === 'student' ? 'disabled' : ''}>
                        <option value="present" ${status === 'present' ? 'selected' : ''}>Был(а)</option>
                        <option value="absent_invalid" ${status === 'absent_invalid' ? 'selected' : ''}>Н (Неуважительная)</option>
                        <option value="absent_valid" ${status === 'absent_valid' ? 'selected' : ''}>Н (Уважительная)</option>
                    </select>
                `;
                container.appendChild(row);
            });

            if (currentUser.role === 'kurator' || currentUser.role === 'student') {
                document.getElementById('save-attendance-btn').classList.add('hidden');
            } else {
                document.getElementById('save-attendance-btn').classList.remove('hidden');
            }

            document.getElementById('attendance-modal').classList.remove('hidden');
        }

        async function openStatsModal() {
            document.getElementById('stats-modal').classList.remove('hidden');
            const container = document.getElementById('stats-container');
            container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Загрузка статистики...</p>`;

            try {
                const res = await fetch('/api/stats');
                statsCache = await res.json();

                let html = `
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-xs text-slate-400 uppercase">
                                <th class="py-2 px-3">ФИО Студента</th>
                                <th class="py-2 px-3 text-center">Подгруппа</th>
                                <th class="py-2 px-3 text-center text-rose-400">Н (Неув.)</th>
                                <th class="py-2 px-3 text-center text-amber-400">Н (Ув.)</th>
                                <th class="py-2 px-3 text-center font-bold">Всего пропусков</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50 text-sm">
                `;

                statsCache.forEach(st => {
                    html += `
                        <tr class="hover:bg-slate-900/40">
                            <td class="py-2.5 px-3 font-medium text-slate-200">${st.name}</td>
                            <td class="py-2.5 px-3 text-center text-slate-400">${st.subgroup}</td>
                            <td class="py-2.5 px-3 text-center font-bold text-rose-400">${st.invalid_absences || 0}</td>
                            <td class="py-2.5 px-3 text-center font-bold text-amber-400">${st.valid_absences || 0}</td>
                            <td class="py-2.5 px-3 text-center font-bold text-indigo-300">${st.total_absences || 0}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p class="text-sm text-rose-400 text-center py-4">Ошибка загрузки статистики</p>`;
            }
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        async function openStudentStatsModal() {
            document.getElementById('student-stats-modal').classList.remove('hidden');
            await loadStudentStats();
        }

        async function loadStudentStats() {
            const monthVal = document.getElementById('stats-month-input').value;
            const container = document.getElementById('student-stats-container');
            container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Загрузка пропусков...</p>`;

            try {
                const res = await fetch(`/api/student-stats?student_id=${currentUser.id}&year_month=${monthVal}`);
                const records = await res.json();

                if (records.length === 0) {
                    container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">За выбранный месяц пропусков (энок) нет.</p>`;
                    return;
                }

                let html = `<div class="space-y-2">`;
                records.forEach(r => {
                    const statusText = r.status === 'absent_invalid' ? '<span class="text-rose-400 font-bold">Н (Неуважительная)</span>' : '<span class="text-amber-400 font-bold">Н (Уважительная)</span>';
                    html += `
                        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50 flex justify-between items-center text-sm">
                            <div>
                                <span class="text-indigo-400 font-semibold">${r.date}</span> (Пара #${r.pair_number})
                                <p class="text-white font-medium text-xs mt-0.5">${r.subject}</p>
                            </div>
                            <div>${statusText}</div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p class="text-sm text-rose-400 text-center py-4">Ошибка загрузки данных</p>`;
            }
        }

        function closeStudentStatsModal() {
            document.getElementById('student-stats-modal').classList.add('hidden');
        }

        function exportToExcel() {
            if (!statsCache || statsCache.length === 0) {
                alert('Нет данных для выгрузки');
                return;
            }

            let csvContent = "\uFEFFФИО Студента;Подгруппа;Н (Неуважительная);Н (Уважительная);Всего пропусков\n";
            statsCache.forEach(st => {
                csvContent += `"${st.name}";${st.subgroup};${st.invalid_absences || 0};${st.valid_absences || 0};${st.total_absences || 0}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `isp25_attendance_stats_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function closeModal() {
            document.getElementById('attendance-modal').classList.add('hidden');
        }

        function filterStudentsList() {
            const query = document.getElementById('student-search').value.toLowerCase();
            const rows = document.querySelectorAll('.student-row');
            rows.forEach(r => {
                const name = r.querySelector('span').innerText.toLowerCase();
                r.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        async function saveAttendance() {
            const dateVal = document.getElementById('selected-date').value;
            const selects = document.querySelectorAll('.status-select');
            const records = [];

            selects.forEach(sel => {
                records.push({
                    student_id: parseInt(sel.dataset.studentId),
                    status: sel.value
                });
            });

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: dateVal,
                        schedule_id: activePairId,
                        records,
                        userRole: currentUser.role
                    })
                });

                if (res.ok) {
                    alert('Посещаемость успешно сохранена!');
                    closeModal();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Ошибка сохранения');
                }
            } catch (err) {
                alert('Ошибка отправки данных на сервер');
            }
        }
    </script>
</body>
</html>
